# dsh-custom-lists bundle patch.
#
# 本文件是插件的挂载声明：DSH 启动时按 bundle 层叠加各插件 patch，把
# 「自定义列表」插入 profile 的配置树。安装由插件管理器完成，无需手工修改
# profile 的 cordis.patch.yml。
#
# Host 半身由下面这一行挂载；浏览器半身由 package.json 的 dsh.client 声明，
# 并绑定在 name 为裸包名的这一行上（子路径行不会携带半身）。
#
# 本文件不含账号、密钥、端点或任何本机路径。
- insert:
    - id: custom-lists
      name: dsh-custom-lists
